project: apache2:2.4-26.04

backends:
  craft:
    type: craft
    systems:
      - ubuntu-24.04:
      #- ubuntu-22.04:

suites:
  spread/general/:
    summary: General integration tests

    prepare: |
      sudo snap install docker

      # For 'rockcraft.skopeo'
      sudo snap install --classic rockcraft

      # Wait for docker daemon to come online
      sudo apt install --yes retry
      retry --times=10 --delay 2 -- docker images
      sudo apt remove --yes retry

      # Load the rock into docker
      sudo rockcraft.skopeo --insecure-policy copy "oci-archive:$CRAFT_ARTIFACT" docker-daemon:apache2:2.4-26.04

    restore: |
      docker image rm --force apache2:2.4-26.04


  spread/k8s/:
    summary: K8s integration tests

    prepare: |
      sudo snap install rockcraft --classic
      
      # on s390x we need to install microk8s from the candidate channel
      CHANNEL="stable"
      if [ "$(uname -m)" = "s390x" ]; then
        CHANNEL="candidate"
      fi
      sudo snap install microk8s --classic --channel=$CHANNEL
      
      # Wait for microk8s to be ready and enable the registry
      microk8s status --wait-ready
      microk8s enable registry
      microk8s kubectl rollout status deployment/registry -n container-registry --timeout=120s

      # Copy the built image to the local registry
      rockcraft.skopeo --insecure-policy copy --dest-tls-verify=false \
        "oci-archive:$CRAFT_ARTIFACT" \
        "docker://localhost:32000/apache2:2.4-26.04"

exclude:
  - .git

kill-timeout: 1h
