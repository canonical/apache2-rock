summary: Create an apache2 container serving static content

execute: |

  # Clean up on exit
  trap "docker stop apache2-rock >/dev/null 2>&1 || true" EXIT

  # Run the Apache2 container
  docker run -d --rm --name apache2-rock -p 8080:80 -v $(pwd)/static:/var/www/html:ro apache2:2.4-26.04

  # Wait for port 8080 to be ready
  sleep 5

  # Get checksums of original and retrieved file
  orig_checksum=$(md5sum $(pwd)/static/test.txt | awk '{print $1}')
  retrieved_checksum=$(curl -sS http://127.0.0.1:8080/test.txt | md5sum | awk '{print $1}')

  # Check that the checksums match
  if [ "$orig_checksum" != "$retrieved_checksum" ]; then
    echo "Checksum mismatch: original ($orig_checksum) vs retrieved ($retrieved_checksum)"
    exit 1
  fi
