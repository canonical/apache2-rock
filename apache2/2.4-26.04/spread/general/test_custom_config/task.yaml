summary: Create an apache2 container with custom configuration

execute: |

  # Clean up on exit
  trap "docker stop apache2-rock >/dev/null 2>&1 || true" EXIT

  # Run the Apache2 container
  docker run -d --rm --name apache2-rock -p 8080:80 \
    -v $(pwd)/html:/srv/www:ro \
    -v $(pwd)/apache2.conf:/etc/apache2/apache2.conf:ro \
    apache2:2.4-26.04

  # Wait for Apache to be ready (timeout after 30 seconds)
  timeout 30 bash -c 'until curl -sSf http://127.0.0.1:8080 >/dev/null; do sleep 1; done'

  # Get checksums of original and retrieved file
  orig_checksum=$(md5sum $(pwd)/html/index.html | awk '{print $1}')
  retrieved_checksum=$(curl -sS http://127.0.0.1:8080 | md5sum | awk '{print $1}')

  # Check that the checksums match
  if [ "$orig_checksum" != "$retrieved_checksum" ]; then
    echo "Checksum mismatch: original ($orig_checksum) vs retrieved ($retrieved_checksum)"
    exit 1
  fi
