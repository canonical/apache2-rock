User ${APACHE_RUN_USER}
Group ${APACHE_RUN_GROUP}
ErrorLog ${APACHE_LOG_DIR}/error.log

HostnameLookups Off

# Include module configuration:
IncludeOptional mods-enabled/*.load
IncludeOptional mods-enabled/*.conf

# proxy isn't enabled by default in the rock; load it for the /probe dns check below.
LoadModule proxy_module /usr/lib/apache2/modules/mod_proxy.so
LoadModule proxy_http_module /usr/lib/apache2/modules/mod_proxy_http.so

# Include list of ports to listen on
Include ports.conf

<Directory />
	Options FollowSymLinks
	AllowOverride None
	Require all denied
</Directory>

<Directory /srv/www/>
	Options Indexes FollowSymLinks
	AllowOverride None
	Require all granted
</Directory>

<VirtualHost *:80>
	DocumentRoot /srv/www

	# /probe proxies to our own headless Service, forcing apache to resolve it via
	# coredns -- exercises the cluster-dns path (500 mid-convergence, 200 once dns settles).
	ProxyPass /probe http://apache2-headless.default.svc.cluster.local:80/
	ProxyPassReverse /probe http://apache2-headless.default.svc.cluster.local:80/
</VirtualHost>

